# suite-managed (deploy) — regenerated by conform, do not edit by hand.
# PROD ONLY: consumed by frontend.Dockerfile's `prod` stage, which serves the
# static Vite build. The dev stage runs the Vite dev server instead and never
# reads this file. Listens on 3354 (the node's registry port), not
# :80, so deploy/Caddyfile's reverse_proxy target is identical in both profiles.
# Il backend si risolve a OGNI richiesta, non una volta sola all'avvio: con un
# blocco `upstream` nginx teneva l'IP visto al boot, e ricreare il container
# backend (nuovo IP) faceva rispondere 502 a ogni /api/* finche' non si
# riavviava anche il frontend — con la pagina che si caricava lo stesso, quindi
# senza sintomi visibili. 127.0.0.11 e' il DNS embedded di Docker; una variabile
# in proxy_pass forza la risoluzione a runtime (cache 10s). Senza URI nella
# variabile, l'URI della richiesta passa invariato come col vecchio upstream.
resolver 127.0.0.11 valid=10s ipv6=off;
server {
    set $backend http://experiencefinder-backend:10020;
    listen 3354 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # WebSocket. Senza questo blocco `location /` cattura /ws e risponde con
    # l'index.html: l'handshake vede un 200 invece di un 101 e la connessione
    # non si apre mai (silenziosamente — il client riprova all'infinito). Serve
    # anche HTTP/1.1: il default di proxy_pass e' 1.0, che non conosce Upgrade.
    # Un nodo senza rotta /ws sul backend qui prende un 404, non un regresso.
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una connessione WS resta aperta a lungo e puo' essere inattiva: col
        # default di 60s nginx la chiuderebbe di continuo.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /assets/ { access_log off; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
